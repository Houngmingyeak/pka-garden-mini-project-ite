<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plantify – Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              pink: {
                primary: "#F06292",
                light: "#F8A1C4",
                dark: "#D81B60",
                50: "#fdf2f6",
                100: "#fce4ee",
              },
            },
            fontFamily: {
              display: ["Playfair Display", "serif"],
              body: ["DM Sans", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "DM Sans", sans-serif;
      }
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-up {
        animation: fadeUp 0.6s ease both;
      }
      .gradient-text {
        background: linear-gradient(135deg, #f06292, #d81b60);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .hero-blob {
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.15;
        pointer-events: none;
      }
      input:focus {
        outline: none;
        border-color: #f06292 !important;
        box-shadow: 0 0 0 3px rgba(240, 98, 146, 0.15);
      }
      .strength-bar {
        height: 4px;
        border-radius: 2px;
        background: #e5e7eb;
        transition: all 0.3s ease;
      }
      .strength-bar.active-weak {
        background: #ef4444;
      }
      .strength-bar.active-fair {
        background: #f97316;
      }
      .strength-bar.active-good {
        background: #eab308;
      }
      .strength-bar.active-strong {
        background: #22c55e;
      }
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #fdf2f6;
      }
      ::-webkit-scrollbar-thumb {
        background: #f06292;
        border-radius: 3px;
      }
    </style>
  </head>
  <body
    class="bg-pink-50 dark:bg-gray-950 min-h-screen flex flex-col items-center justify-center transition-colors duration-300 py-12"
  >
    <!-- Background blobs -->
    <div class="hero-blob w-96 h-96 bg-pink-primary -top-20 -left-20"></div>
    <div class="hero-blob w-72 h-72 bg-pink-light top-1/2 -right-16"></div>
    <div class="hero-blob w-64 h-64 bg-pink-dark -bottom-16 left-1/3"></div>

    <!-- Top bar -->
    <div
      class="w-full max-w-md flex items-center justify-between px-2 mb-4 relative z-10 fade-up"
    >
      <a href="../index.html" class="flex items-center gap-2 group">
        <div class="w-24 h-24 flex items-center justify-center">
          <img src="../assets/pka_logo.png" alt="pkalogo" />
        </div>
      </a>
      <button
        onclick="toggleDark()"
        class="w-9 h-9 rounded-full flex items-center justify-center bg-white dark:bg-gray-800 shadow-sm hover:shadow-md transition-all"
      >
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- Card -->
    <div class="w-full max-w-md px-2 relative z-10 fade-up">
      <div
        class="bg-white dark:bg-gray-900 rounded-3xl shadow-xl border border-pink-100 dark:border-gray-800 overflow-hidden"
      >
        <div
          class="h-1.5 bg-gradient-to-r from-pink-primary to-pink-dark"
        ></div>
        <div class="p-8">
          <h1
            class="font-display text-2xl font-bold text-gray-900 dark:text-white mb-1"
          >
            Create your account
          </h1>
          <p class="text-gray-500 dark:text-gray-400 text-sm mb-8">
            Join thousands of plant lovers today.
          </p>

          <!-- Social signup -->
          <div class="flex gap-3 mb-6">
            <button
              class="flex-1 flex items-center justify-center gap-2 border border-gray-200 dark:border-gray-700 rounded-xl py-2.5 text-sm font-medium hover:border-pink-primary hover:bg-pink-50 dark:hover:bg-gray-800 transition-all text-gray-700 dark:text-gray-300"
            >
              <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path
                  fill="#4285F4"
                  d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                />
                <path
                  fill="#34A853"
                  d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                />
                <path
                  fill="#FBBC05"
                  d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                />
                <path
                  fill="#EA4335"
                  d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                />
              </svg>
              Google
            </button>
            <button
              class="flex-1 flex items-center justify-center gap-2 border border-gray-200 dark:border-gray-700 rounded-xl py-2.5 text-sm font-medium hover:border-pink-primary hover:bg-pink-50 dark:hover:bg-gray-800 transition-all text-gray-700 dark:text-gray-300"
            >
              <svg class="w-4 h-4" fill="#1877F2" viewBox="0 0 24 24">
                <path
                  d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
                />
              </svg>
              Facebook
            </button>
          </div>

          <div class="flex items-center gap-3 mb-6">
            <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
            <span class="text-xs text-gray-400">or sign up with email</span>
            <div class="flex-1 h-px bg-gray-200 dark:bg-gray-700"></div>
          </div>

          <div class="space-y-4">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
                  >First name</label
                >
                <input
                  type="text"
                  id="firstName"
                  placeholder="Ches"
                  class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 text-sm transition-all placeholder-gray-400 text-gray-800 dark:text-white"
                />
              </div>
              <div>
                <label
                  class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
                  >Last name</label
                >
                <input
                  type="text"
                  id="lastName"
                  placeholder="Sovanreach"
                  class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 text-sm transition-all placeholder-gray-400 text-gray-800 dark:text-white"
                />
              </div>
            </div>
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
                >Email address</label
              >
              <input
                type="email"
                id="email"
                placeholder="hello@pka.com"
                class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 text-sm transition-all placeholder-gray-400 text-gray-800 dark:text-white"
              />
            </div>
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
                >Password</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="password"
                  placeholder="Min. 8 characters"
                  oninput="checkStrength(this.value)"
                  class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 text-sm transition-all placeholder-gray-400 text-gray-800 dark:text-white pr-12"
                />
                <button
                  type="button"
                  onclick="togglePwd('password')"
                  class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-pink-primary transition-colors"
                >
                  <svg
                    class="w-5 h-5"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="2"
                      d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
                    />
                  </svg>
                </button>
              </div>
              <div class="flex gap-1.5 mt-2">
                <div id="s1" class="strength-bar flex-1"></div>
                <div id="s2" class="strength-bar flex-1"></div>
                <div id="s3" class="strength-bar flex-1"></div>
                <div id="s4" class="strength-bar flex-1"></div>
              </div>
              <p id="strengthLabel" class="text-xs text-gray-400 mt-1"></p>
            </div>
            <div>
              <label
                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5"
                >Confirm password</label
              >
              <input
                type="password"
                id="confirmPwd"
                placeholder="Repeat your password"
                class="w-full border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800 rounded-xl px-4 py-3 text-sm transition-all placeholder-gray-400 text-gray-800 dark:text-white"
              />
            </div>

            <label class="flex items-start gap-2 cursor-pointer">
              <input
                type="checkbox"
                id="terms"
                class="w-4 h-4 rounded accent-pink-primary mt-0.5 shrink-0"
              />
              <span class="text-sm text-gray-600 dark:text-gray-400"
                >I agree to the
                <a href="#" class="text-pink-primary hover:underline"
                  >Terms of Service</a
                >
                and
                <a href="#" class="text-pink-primary hover:underline"
                  >Privacy Policy</a
                ></span
              >
            </label>
            <label class="flex items-start gap-2 cursor-pointer">
              <input
                type="checkbox"
                id="newsletter"
                class="w-4 h-4 rounded accent-pink-primary mt-0.5 shrink-0"
                checked
              />
              <span class="text-sm text-gray-600 dark:text-gray-400"
                >Send me plant care tips and exclusive offers 🌱</span
              >
            </label>

            <!-- Error -->
            <div
              id="errorMsg"
              class="hidden bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-xl px-4 py-3 text-sm text-red-600 dark:text-red-400"
            ></div>

            <button
              onclick="handleSignup()"
              class="w-full bg-gradient-to-r from-pink-primary to-pink-dark text-white font-semibold py-3.5 rounded-xl hover:shadow-lg hover:scale-[1.02] transition-all mt-1"
            >
              Create Account 🌸
            </button>
          </div>

          <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-6">
            Already have an account?
            <a
              href="login.html"
              class="text-pink-primary font-semibold hover:underline ml-1"
              >Sign in →</a
            >
          </p>
        </div>
      </div>

      <p class="text-center text-xs text-gray-400 mt-6">
        By creating an account, you agree to our
        <a href="#" class="text-pink-primary hover:underline">Terms</a> and
        <a href="#" class="text-pink-primary hover:underline">Privacy Policy</a
        >.
      </p>
    </div>
    <script>
      (function () {
        const isDark = localStorage.getItem("theme") === "dark";
        if (isDark) document.documentElement.classList.add("dark");
        window.addEventListener("DOMContentLoaded", () => {
          const icon = document.getElementById("darkIcon");
          if (icon) icon.textContent = isDark ? "☀️" : "🌙";
        });
      })();

      function toggleDark() {
        document.documentElement.classList.toggle("dark");
        const isDark = document.documentElement.classList.contains("dark");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        const icon = document.getElementById("darkIcon");
        if (icon) icon.textContent = isDark ? "☀️" : "🌙";
      }
      function togglePwd(id) {
        const input = document.getElementById(id);
        input.type = input.type === "password" ? "text" : "password";
      }
      function checkStrength(val) {
        const bars = ["s1", "s2", "s3", "s4"].map((id) =>
          document.getElementById(id),
        );
        const label = document.getElementById("strengthLabel");
        bars.forEach((b) => {
          b.className = "strength-bar flex-1";
        });
        if (!val) {
          label.textContent = "";
          return;
        }
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const colors = [
          "",
          "active-weak",
          "active-fair",
          "active-good",
          "active-strong",
        ];
        const texts = [
          "",
          "Weak — add uppercase & numbers",
          "Fair — try adding symbols",
          "Good — almost there!",
          "Strong password ✓",
        ];
        const labelColors = [
          "",
          "text-red-500",
          "text-orange-500",
          "text-yellow-500",
          "text-green-500",
        ];
        for (let i = 0; i < score; i++) bars[i].classList.add(colors[score]);
        label.textContent = texts[score];
        label.className = `text-xs mt-1 ${labelColors[score]}`;
      }
      function handleSignup() {
        const fn = document.getElementById("firstName").value.trim();
        const ln = document.getElementById("lastName").value.trim();
        const email = document.getElementById("email").value.trim();
        const pwd = document.getElementById("password").value;
        const cpwd = document.getElementById("confirmPwd").value;
        const terms = document.getElementById("terms").checked;
        const err = document.getElementById("errorMsg");
        if (!fn || !ln || !email || !pwd || !cpwd) {
          err.textContent = "Please fill in all fields.";
          err.classList.remove("hidden");
          return;
        }
        if (pwd.length < 8) {
          err.textContent = "Password must be at least 8 characters.";
          err.classList.remove("hidden");
          return;
        }
        if (pwd !== cpwd) {
          err.textContent = "Passwords do not match.";
          err.classList.remove("hidden");
          return;
        }
        if (!terms) {
          err.textContent = "Please accept the Terms of Service to continue.";
          err.classList.remove("hidden");
          return;
        }
        err.classList.add("hidden");
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
